[package]
name = "decdvb-cli"
description = "DecDVB command line: analyse, decode and modulate DVB-S2/S2X"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "decdvb"
path = "src/main.rs"

[features]
default = []
hackrf = ["decdvb-io/hackrf"]

[dependencies]
decdvb-core = { path = "../../crates/decdvb-core" }
decdvb-io = { path = "../../crates/decdvb-io" }
decdvb-dsp = { path = "../../crates/decdvb-dsp" }
decdvb-engine = { path = "../../crates/decdvb-engine" }
anyhow.workspace = true
clap = { version = "4.6", features = ["derive"] }
